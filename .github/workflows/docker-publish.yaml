name: Docker Publish (Wazai)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${REGISTRY}/${OWNER}/wazai-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.app }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.app }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.app }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${REGISTRY}/${OWNER}/wazai-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.app }}
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Wazai (${{ matrix.app }})
            org.opencontainers.image.description=Wazai ${{ matrix.app }} service image

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.app }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

  update-ops:
    runs-on: ubuntu-latest
    needs: merge
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Update image tags in KoukeNeko-Ops
        env:
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          BACKEND_IMAGE="${{ env.REGISTRY }}/${OWNER}/wazai-backend:${SHA_TAG}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${OWNER}/wazai-frontend:${SHA_TAG}"

          git clone "https://x-access-token:${OPS_REPO_TOKEN}@github.com/KoukeNeko/KoukeNeko-Ops.git" /tmp/ops
          cd /tmp/ops

          sed -i "s|^[[:space:]]*image:[[:space:]]*ghcr.io/.*/wazai-backend:.*|          image: ${BACKEND_IMAGE}|" apps/Wazai/backend-deployment.yaml
          sed -i "s|^[[:space:]]*image:[[:space:]]*ghcr.io/.*/wazai-frontend:.*|          image: ${FRONTEND_IMAGE}|" apps/Wazai/frontend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/Wazai/backend-deployment.yaml apps/Wazai/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "chore(wazai): update images to ${SHA_TAG}"
          git push
